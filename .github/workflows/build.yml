name: Build AnimeBustPhysics

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -q ./*.zip -d proyecto
          BUILD_FILE=$(find proyecto -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "No se encontró build.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Compilar mod
        run: |
          cd "$PROJECT_DIR"
          gradle build

      - name: Preparar archivo JAR
        run: |
          mkdir -p dist
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" -exec cp {} dist/ \;

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnimeBustPhysics-JAR
          path: dist/*.jar
