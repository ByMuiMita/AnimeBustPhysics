
name: Build AnimeBustPhysics Modified

on:
  workflow_dispatch:
  push:
    paths:
      - "AnimeBustPhysics-source-modificado.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -q ./AnimeBustPhysics-source-modificado-v2.zip -d proyecto
          
          BUILD_FILE=$(find proyecto -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "No se encontró build.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Compilar mod
        run: |
          cd "$PROJECT_DIR"
          gradle build

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnimeBustPhysics-Modificado
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          
